<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEPHYX - Saved Fits</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/glitch.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div id="starfield"></div>
    <div id="particles"></div>

    <div class="audio-controls">
        <button id="audioToggle" class="audio-btn">
            <i class="fas fa-volume-up"></i>
        </button>
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo glitch" data-text="SEPHYX">SEPHYX</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="shop.html" class="nav-link">Shop</a>
                <a href="lookbook.html" class="nav-link">Lookbook</a>
                <a href="saved.html" class="nav-link active">Saved Fits</a>
                <a href="customizer.html" class="nav-link">Outfit Generator</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <a href="track.html" class="nav-link">Track Order</a>
                <a href="account.html" class="nav-link">Account</a>
            </div>
            <div class="nav-icons">
                <button id="cartToggle" class="cart-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <section class="saved-header">
            <h1 class="page-title glitch" data-text="SAVED FITS">SAVED FITS</h1>
            <p class="page-subtitle">Keep your drip locked in 'til payday.</p>
        </section>

        <section class="saved-content">
            <div class="saved-tabs">
                <button class="tab-btn active" data-tab="products">Saved Products</button>
                <button class="tab-btn" data-tab="fits">Saved Fits</button>
            </div>

            <div class="tab-content active" id="products-tab">
                <div class="saved-grid" id="savedProducts">
                    <!-- Saved products will be loaded here -->
                </div>
            </div>

            <div class="tab-content" id="fits-tab">
                <div class="saved-fits-grid" id="savedFits">
                    <!-- Saved fits will be loaded here -->
                </div>
            </div>
        </section>
    </main>

    <!-- Cart Drawer -->
    <div id="cartDrawer" class="cart-drawer">
        <div class="cart-header">
            <h3>Your Vault</h3>
            <button id="closeCart" class="close-btn">&times;</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total">Total: QR <span id="cartTotal">0</span></div>
            <button class="checkout-btn" id="checkoutBtn">Buy Now</button>
        </div>
    </div>

    <!-- Chatbot -->
    <div class="chatbot-widget">
        <button class="chatbot-toggle" id="chatbotToggle">
            <i class="fas fa-comments"></i>
        </button>
        <div class="chatbot-window" id="chatbotWindow">
            <div class="chatbot-header">
                <span>SEPHYX AI</span>
                <button class="chatbot-close" id="chatbotClose">&times;</button>
            </div>
            <div class="chatbot-messages" id="chatbotMessages"></div>
            <div class="chatbot-input">
                <input type="text" id="chatbotInput" placeholder="type your vibe...">
                <button id="chatbotSend"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/main.js"></script>
    <script>
        const storage = new LocalStorage();

        document.addEventListener('DOMContentLoaded', function() {
            loadSavedProducts();
            loadSavedFits();
            setupTabs();
        });

        function setupTabs() {
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');

            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const tabId = this.dataset.tab;
                    
                    // Remove active from all tabs
                    tabBtns.forEach(b => b.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));
                    
                    // Add active to clicked tab
                    this.classList.add('active');
                    document.getElementById(`${tabId}-tab`).classList.add('active');
                });
            });
        }

        function loadSavedProducts() {
            const savedProducts = storage.get('savedProducts', []);
            const container = document.getElementById('savedProducts');
            
            if (savedProducts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-heart-broken"></i>
                        <h3>No saved products yet</h3>
                        <p>Start saving your favorite items from the shop</p>
                        <a href="shop.html" class="cta-button">Browse Shop</a>
                    </div>
                `;
                return;
            }

            const products = getProducts();
            container.innerHTML = savedProducts.map(productId => {
                const product = products.find(p => p.id === productId);
                if (!product) return '';
                
                return `
                    <div class="saved-item">
                        <div class="saved-image">
                            <img src="${product.image}" alt="${product.name}" loading="lazy">
                        </div>
                        <div class="saved-info">
                            <h3>${product.name}</h3>
                            <p class="saved-price">QR ${product.price}</p>
                            <div class="saved-actions">
                                <button class="action-btn add-cart" onclick="addToCart(${product.id})">
                                    <i class="fas fa-cart-plus"></i> Add to Cart
                                </button>
                                <button class="action-btn remove-saved" onclick="removeSaved(${product.id})">
                                    <i class="fas fa-heart-broken"></i> Remove
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function loadSavedFits() {
            const savedFits = storage.get('savedFits', []);
            const container = document.getElementById('savedFits');
            
            if (savedFits.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-tshirt"></i>
                        <h3>No saved fits yet</h3>
                        <p>Create and save your perfect combinations</p>
                        <a href="customizer.html" class="cta-button">Create Fit</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = savedFits.map(fit => `
                <div class="saved-fit">
                    <div class="fit-header">
                        <h3>Fit #${fit.id}</h3>
                        <span class="fit-date">${new Date(fit.created).toLocaleDateString()}</span>
                    </div>
                    <div class="fit-items">
                        ${fit.items.map(item => `
                            <div class="fit-item">
                                <img src="${item.image}" alt="${item.name}">
                                <div class="item-details">
                                    <span class="item-name">${item.name}</span>
                                    <span class="item-price">QR ${item.price}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="fit-footer">
                        <span class="fit-total">Total: QR ${fit.total}</span>
                        <div class="fit-actions">
                            <button class="action-btn" onclick="addFitToCart(${fit.id})">
                                <i class="fas fa-cart-plus"></i> Add All to Cart
                            </button>
                            <button class="action-btn remove-fit" onclick="removeFit(${fit.id})">
                                <i class="fas fa-trash"></i> Remove Fit
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function removeSaved(productId) {
            const savedProducts = storage.get('savedProducts', []);
            const updatedSaved = savedProducts.filter(id => id !== productId);
            storage.set('savedProducts', updatedSaved);
            loadSavedProducts();
            
            // Update heart icon in shop if present
            const heartBtn = document.querySelector(`[onclick="saveProduct(${productId})"]`);
            if (heartBtn) {
                heartBtn.innerHTML = '<i class="fas fa-heart"></i>';
            }
        }

        function removeFit(fitId) {
            const savedFits = storage.get('savedFits', []);
            const updatedFits = savedFits.filter(fit => fit.id !== fitId);
            storage.set('savedFits', updatedFits);
            loadSavedFits();
        }

        function addFitToCart(fitId) {
            const savedFits = storage.get('savedFits', []);
            const fit = savedFits.find(f => f.id === fitId);
            
            if (fit) {
                fit.items.forEach(item => {
                    addToCart(item.id, false, 'M'); // Default size M
                });
                
                // Visual feedback
                const btn = event.target.closest('.action-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Added!';
                btn.style.background = 'var(--neon-cyan)';
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                }, 2000);
            }
        }
    </script>

    <style>
        .saved-header {
            text-align: center;
            margin: 100px 0 50px;
        }

        .saved-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .saved-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            gap: 20px;
        }

        .tab-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .tab-btn.active,
        .tab-btn:hover {
            background: var(--neon-cyan);
            color: black;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .saved-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .saved-item {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon-cyan);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .saved-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 255, 255, 0.3);
        }

        .saved-image img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .saved-info {
            padding: 20px;
        }

        .saved-info h3 {
            margin-bottom: 10px;
            color: white;
        }

        .saved-price {
            color: var(--neon-cyan);
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .saved-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--neon-cyan);
            background: transparent;
            color: var(--neon-cyan);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .action-btn:hover {
            background: var(--neon-cyan);
            color: black;
        }

        .remove-saved {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        .remove-saved:hover {
            background: var(--neon-pink);
            color: black;
        }

        .saved-fits-grid {
            display: grid;
            gap: 30px;
        }

        .saved-fit {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon-pink);
            border-radius: 15px;
            padding: 25px;
        }

        .fit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--neon-pink);
        }

        .fit-date {
            color: var(--neon-cyan);
            font-size: 0.9rem;
        }

        .fit-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .fit-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
        }

        .fit-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }

        .item-details {
            display: flex;
            flex-direction: column;
        }

        .item-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .item-price {
            color: var(--neon-cyan);
            font-size: 0.9rem;
        }

        .fit-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--neon-pink);
        }

        .fit-total {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--neon-pink);
        }

        .fit-actions {
            display: flex;
            gap: 10px;
        }

        .remove-fit {
            border-color: #ff4444;
            color: #ff4444;
        }

        .remove-fit:hover {
            background: #ff4444;
            color: black;
        }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: rgba(255, 255, 255, 0.7);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: var(--neon-cyan);
        }

        .empty-state h3 {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .empty-state p {
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
    </style>
</body>
</html>
